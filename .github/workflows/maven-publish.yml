# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  workflow_dispatch:
    inputs:
      releaseversion:
        description: 'Release version'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Maven Central Repository
      uses: actions/setup-java@v5
      with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # Central Portal credentials (Portal user token), NOT OSSRH
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSHR_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
        
    - name: Set projects Maven version to GitHub Action GUI set version
      run: mvn versions:set "-DnewVersion=${{ github.event.inputs.releaseversion }}"
      
    - name: Publish to Maven Central
      run: mvn deploy --batch-mode --no-transfer-progress -P Release -DskipTests
      env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          MAVEN_OPTS: "-Djava.net.preferIPv4Stack=true -Dmaven.wagon.http.retryHandler.count=5"
          
    - name: Update readme.md
      run: sed -i "s/$(git describe --tags --abbrev=0 | cut -c 2-)/${{ github.event.inputs.releaseversion }}/g" README.md
          
    - uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: Update POM version
        file_pattern: 'docs pom.xml README.md'
        
    - name: Create GitHub Release
      env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat << 'EOF' > notes.md
        Grab the new version from Maven Central:

        ```xml
        <dependency>
            <groupId>com.github.miachm.sods</groupId>
            <artifactId>SODS</artifactId>
            <version>${{ github.event.inputs.releaseversion }}</version>
        </dependency>
        ```
        EOF
        gh release create "v${{ github.event.inputs.releaseversion }}" \
          --title "v${{ github.event.inputs.releaseversion }}" \
          --notes-file notes.md
